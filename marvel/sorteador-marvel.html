<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteador Marvel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Archivo:ital,wght@0,500;0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --marvel-red:#ED1D24;
    --marvel-red-dark:#B5121A;
    --ink:#0B0B0E;
    --paper:#F3ECD8;
    --yellow:#FFC700;
    --blue:#1B4FD1;
    --purple:#6B2FBE;
    --line:#0B0B0E;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
  }

  body{
    font-family:'Archivo', sans-serif;
    background-color:var(--marvel-red);
    background-image:
      radial-gradient(circle, rgba(0,0,0,0.16) 1.6px, transparent 1.6px);
    background-size: 14px 14px;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  /* ---------- HERO ---------- */
  .hero{
    text-align:center;
    color:var(--paper);
  }

  .eyebrow{
    display:inline-block;
    font-weight:900;
    letter-spacing:.3em;
    font-size:12px;
    background:var(--ink);
    color:var(--yellow);
    padding:6px 14px;
    border-radius:2px;
    transform:rotate(-2deg);
    margin-bottom:14px;
  }

  h1{
    font-family:'Bangers', cursive;
    font-size:clamp(48px, 11vw, 84px);
    line-height:0.9;
    margin:0;
    letter-spacing:2px;
    color:var(--yellow);
    -webkit-text-stroke: 3px var(--ink);
    text-stroke: 3px var(--ink);
    text-shadow: 5px 5px 0 var(--ink);
    transform:rotate(-1.5deg);
  }

  .subtitle{
    font-weight:700;
    font-style:italic;
    margin-top:10px;
    color:var(--paper);
    font-size:15px;
    opacity:.9;
  }

  /* ---------- PAINEL / QUADRINHO ---------- */
  .panel{
    position:relative;
    width:100%;
    background:var(--paper);
    background-image: radial-gradient(circle, rgba(11,11,14,0.12) 1.4px, transparent 1.4px);
    background-size:10px 10px;
    border:5px solid var(--ink);
    border-radius:8px;
    box-shadow:10px 10px 0 var(--ink);
    padding:28px;
    min-height:230px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:10px;
  }

  .badge{
    position:absolute;
    top:-18px;
    left:-14px;
    font-family:'Bangers', cursive;
    font-size:18px;
    letter-spacing:1px;
    color:var(--paper);
    background:var(--ink);
    padding:8px 14px 6px;
    border-radius:6px;
    transform:rotate(-6deg);
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 rgba(0,0,0,.35);
  }
  .badge.filme{background:var(--marvel-red);}
  .badge.serie{background:var(--blue);}
  .badge.desenho{background:var(--purple);}

  .placeholder-msg{
    font-weight:700;
    font-size:17px;
    opacity:.65;
  }

  .reel-title{
    font-family:'Bangers', cursive;
    font-size:clamp(28px, 6vw, 46px);
    letter-spacing:1px;
    line-height:1.05;
    color:var(--ink);
  }

  .reel-meta{
    display:flex;
    gap:10px;
    align-items:center;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    opacity:.75;
  }

  .reel-meta .dot{
    width:5px;height:5px;background:var(--ink);border-radius:50%;
  }

  .spinning .reel-title{
    filter:blur(0.4px);
  }

  .burst-lines{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity .25s ease;
  }
  .panel.landed .burst-lines{ opacity:1; }

  .burst-lines span{
    position:absolute;
    top:50%;left:50%;
    width:2px;height:46%;
    background:var(--marvel-red);
    transform-origin:center bottom;
    opacity:.55;
  }

  /* ---------- BOTÃO ---------- */
  .spin-btn{
    font-family:'Bangers', cursive;
    font-size:28px;
    letter-spacing:2px;
    color:var(--paper);
    background:var(--ink);
    border:4px solid var(--ink);
    padding:16px 44px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:6px 6px 0 var(--marvel-red-dark);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .spin-btn:hover{
    transform:translate(-2px,-2px);
    box-shadow:8px 8px 0 var(--marvel-red-dark);
  }
  .spin-btn:active,
  .spin-btn.pressed{
    transform:translate(4px,4px);
    box-shadow:2px 2px 0 var(--marvel-red-dark);
  }
  .spin-btn:disabled{
    cursor:default;
    opacity:.85;
  }
  .spin-btn:focus-visible{
    outline:3px solid var(--yellow);
    outline-offset:3px;
  }

  /* ---------- FILTROS ---------- */
  .filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .filter-chip{
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    background:var(--paper);
    border:3px solid var(--ink);
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    user-select:none;
  }
  .filter-chip[aria-pressed="true"]{
    background:var(--yellow);
    box-shadow:3px 3px 0 var(--ink);
  }

  footer{
    color:var(--paper);
    font-size:12px;
    opacity:.75;
    text-align:center;
    font-weight:700;
  }

  @media (prefers-reduced-motion: reduce){
    .spin-btn, .panel, .burst-lines{ transition:none; }
  }
</style>
</head>
<body>

<main class="stage">

  <div class="hero">
    <span class="eyebrow">SORTEADOR NÃO OFICIAL</span>
    <h1>SORTEADOR<br>MARVEL</h1>
    <p class="subtitle">Aperte o botão e descubra o que assistir hoje.</p>
  </div>

  <div class="filters" role="group" aria-label="Filtrar por tipo">
    <button class="filter-chip" data-type="todos" aria-pressed="true">Tudo</button>
    <button class="filter-chip" data-type="filme" aria-pressed="false">Filmes</button>
    <button class="filter-chip" data-type="serie" aria-pressed="false">Séries</button>
    <button class="filter-chip" data-type="desenho" aria-pressed="false">Desenhos</button>
  </div>

  <section class="panel" id="panel">
    <div class="burst-lines" id="burstLines"></div>
    <p class="placeholder-msg" id="placeholderMsg">Clique em "GIRAR!" para sortear uma produção.</p>
    <span class="badge" id="badge" hidden></span>
    <h2 class="reel-title" id="reelTitle" hidden></h2>
    <div class="reel-meta" id="reelMeta" hidden></div>
  </section>

  <button class="spin-btn" id="spinBtn">GIRAR!</button>

  <footer>Feito com HTML, CSS e JavaScript &mdash; sem conexão com a Marvel Studios.</footer>

</main>

    { titulo: "Capitão América", ano: 1979, tipo: "serie" },
  ];

  const TIPO_LABEL = { filme: "FILME", serie: "SÉRIE", desenho: "DESENHO" };

  // ---------- ESTADO ----------
  let filtroAtual = "todos";

  const panel = document.getElementById("panel");
  const spinBtn = document.getElementById("spinBtn");
  const badge = document.getElementById("badge");
  const reelTitle = document.getElementById("reelTitle");
  const reelMeta = document.getElementById("reelMeta");
  const placeholderMsg = document.getElementById("placeholderMsg");
  const burstLines = document.getElementById("burstLines");
  const chips = document.querySelectorAll(".filter-chip");

  // gera as linhas de "explosão" uma vez
  const NUM_LINES = 16;
  for (let i = 0; i < NUM_LINES; i++) {
    const line = document.createElement("span");
    const angle = (360 / NUM_LINES) * i;
    line.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
    burstLines.appendChild(line);
  }

  chips.forEach(chip => {
    chip.addEventListener("click", () => {
      chips.forEach(c => c.setAttribute("aria-pressed", "false"));
      chip.setAttribute("aria-pressed", "true");
      filtroAtual = chip.dataset.type;
    });
  });

  function listaFiltrada() {
    if (filtroAtual === "todos") return PRODUCOES;
    return PRODUCOES.filter(p => p.tipo === filtroAtual);
  }

  function itemAleatorio() {
    const lista = listaFiltrada();
    return lista[Math.floor(Math.random() * lista.length)];
  }

  function mostrarItem(item) {
    placeholderMsg.hidden = true;

    badge.hidden = false;
    badge.textContent = TIPO_LABEL[item.tipo];
    badge.className = "badge " + item.tipo;

    reelTitle.hidden = false;
    reelTitle.textContent = item.titulo;

    reelMeta.hidden = false;
    reelMeta.innerHTML = `<span>${item.ano}</span><span class="dot"></span><span>${TIPO_LABEL[item.tipo]}</span>`;
  }

  function girar() {
    if (listaFiltrada().length === 0) return;

    spinBtn.disabled = true;
    panel.classList.add("spinning");
    panel.classList.remove("landed");

    let elapsed = 0;
    const totalDuration = 1500; // ms
    let delay = 60;

    function tick() {
      mostrarItem(itemAleatorio());
      elapsed += delay;

      if (elapsed < totalDuration) {
        delay += 12; // vai desacelerando, como um caça-níquel
        setTimeout(tick, delay);
      } else {
        // resultado final
        mostrarItem(itemAleatorio());
        panel.classList.remove("spinning");
        panel.classList.add("landed");
        spinBtn.disabled = false;
      }
    }

    tick();
  }

  spinBtn.addEventListener("click", girar);
</script>
